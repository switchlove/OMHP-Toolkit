name: Bug report
description: Something in OMHP Toolkit isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Steps to reproduce help a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version
      description: Shown in your userscript manager's dashboard.
      placeholder: e.g. 0.24
    validations:
      required: true
  - type: dropdown
    id: manager
    attributes:
      label: Userscript manager
      options:
        - Tampermonkey
        - Violentmonkey
        - Greasemonkey
        - Other
    validations:
      required: true
  - type: input
    id: others
    attributes:
      label: Other userscripts on the site
      description: Optional. Any other scripts you run on onemillionhp.com, e.g. 1MHP Data Statistics.
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 130, Firefox 132
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Press F12, open the Console tab, reload the game, and paste any red errors here.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images in here.
