name: Release

# Publishes a GitHub release whenever a push to main raises @version.
on:
  push:
    branches: [main]
    paths: [omhp-toolkit.user.js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create release for @version if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -oP '^//\s*@version\s+\K\S+' omhp-toolkit.user.js)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released, skipping."
            exit 0
          fi
          gh release create "$TAG" omhp-toolkit.user.js --target "$GITHUB_SHA" --title "$TAG" --generate-notes
