name: Release

# Publishes a GitHub release whenever a push to main raises @version.
on:
  push:
    branches: [main]
    paths: [omhp-toolkit.user.js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # earlier tags, for the release notes

      - name: Create release for @version if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -oP '^//\s*@version\s+\K\S+' omhp-toolkit.user.js)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released, skipping."
            exit 0
          fi
          if PREV=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null); then
            bash .github/release-notes.sh "$PREV" "$GITHUB_SHA" "$TAG" > notes.md
            NOTES=(--notes-file notes.md)
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$TAG" omhp-toolkit.user.js --target "$GITHUB_SHA" --title "$TAG" "${NOTES[@]}"
